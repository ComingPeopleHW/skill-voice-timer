name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build app and checks
        run: dotnet build tests/SkillVoiceTimer.Checks.csproj -c Release
      - name: Exercise timers, settings and Windows UI
        shell: pwsh
        env:
          SKILL_TIMER_EDITOR_PREVIEW: shortcut-editor.png
        run: ./tests/bin/Release/net48/SkillVoiceTimer.Checks.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ShortcutEditorPreview
          path: shortcut-editor.png
          if-no-files-found: error
      - name: Package portable Windows app
        shell: pwsh
        run: |
          Copy-Item README.md bin/Release/net48/README.md
          Compress-Archive -Path bin/Release/net48/SkillVoiceTimer.exe,bin/Release/net48/SkillVoiceTimer.exe.config,bin/Release/net48/README.md -DestinationPath SkillVoiceTimer-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SkillVoiceTimer-Windows
          path: SkillVoiceTimer-Windows.zip
          if-no-files-found: error
